<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" aria-label="Animated terminal">
<style>
text{font-family:"JetBrains Mono","Fira Code",Consolas,"DejaVu Sans Mono",Menlo,monospace;font-size:14px;white-space:pre}
@keyframes show{to{opacity:1}}
@keyframes hide{to{opacity:0}}
@keyframes blink{50%{opacity:0}}
.s1{opacity:0;animation:show .01s 0.60s forwards}
.s3{opacity:0;animation:show .01s 0.60s forwards}
